services:
  postgres:
    image: postgres:16-alpine
    container_name: coffeeshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coffeeshop
      POSTGRES_PASSWORD: coffeeshop
      POSTGRES_DB: coffeeshop
    ports:
      - "5432:5432"
    volumes:
      - coffeeshop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeeshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: coffeeshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - coffeeshop-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coffeeshop-pgdata:
  coffeeshop-redis:
